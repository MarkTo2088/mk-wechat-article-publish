<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mk-wechat-article-publish 本地设置</title>
  <style>
    :root { --bg: #0f1115; --card: #1a1d24; --text: #e8eaed; --muted: #9aa0a6; --accent: #00ff88; --border: #2c313a; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a3d2e 0%, transparent 50%), var(--bg);
      color: var(--text);
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.5; }
    section {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px 18px 8px; margin-bottom: 16px;
    }
    section h2 { font-size: 0.95rem; margin: 0 0 12px; color: var(--accent); font-weight: 600; }
    .row { margin-bottom: 14px; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
    .color-row { display: flex; gap: 10px; align-items: center; }
    input[type="color"] {
      width: 48px; height: 36px; border: none; padding: 0; background: transparent; cursor: pointer;
    }
    input[type="text"], input[type="password"], input[type="number"] {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: #12151a; color: var(--text); font-size: 0.95rem;
    }
    .color-row input[type="text"] { flex: 1; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    button {
      padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 0.95rem;
    }
    button.primary { background: var(--accent); color: #111; }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    #msg { margin-top: 14px; font-size: 0.9rem; min-height: 1.4em; }
    #msg.ok { color: var(--accent); }
    #msg.err { color: #ff6b6b; }
    .path { font-family: ui-monospace, monospace; font-size: 0.75rem; color: var(--muted); word-break: break-all; }
    .warn { font-size: 0.8rem; color: #e6c07b; margin-top: 8px; line-height: 1.45; }
  </style>
</head>
<body>
<main>
  <h1>本地统一设置</h1>
  <p class="sub">默认保存到<strong>当前工作空间</strong>的 <code>.mk-wechat-publish/config.json</code>（多公众号可按项目分开）。工作空间配置优先于 skill 级与环境变量。品牌色也可让助手按你的描述生成后写入，不必只在本页手选。</p>

  <section>
    <h2>品牌色</h2>
    <div class="row">
      <label>主色 brand_primary</label>
      <div class="color-row">
        <input type="color" id="primaryColor" value="#00ff88" />
        <input type="text" id="primaryHex" value="#00ff88" />
      </div>
    </div>
    <div class="row">
      <label>次色 brand_secondary（标题渐变）</label>
      <div class="color-row">
        <input type="color" id="secondaryColor" value="#00d4ff" />
        <input type="text" id="secondaryHex" value="#00d4ff" />
      </div>
    </div>
    <div class="row">
      <label>画廊图片宽度 %</label>
      <input type="number" id="galleryWidth" min="20" max="100" value="62" />
    </div>
  </section>

  <section>
    <h2>公众号凭证（发布草稿）</h2>
    <div class="row">
      <label>公众号名称</label>
      <input type="text" id="wechatName" autocomplete="off" placeholder="例如：XLanAI，便于区分多个号" />
    </div>
    <div class="row">
      <label>AppID</label>
      <input type="text" id="wechatAppId" autocomplete="off" placeholder="wx..." />
    </div>
    <div class="row">
      <label>AppSecret</label>
      <input type="password" id="wechatAppSecret" autocomplete="off" placeholder="留空则不修改已保存的密钥" />
    </div>
  </section>

  <section>
    <h2>小程序凭证（可选，生成小程序码）</h2>
    <div class="row">
      <label>Mini AppID</label>
      <input type="text" id="miniAppId" autocomplete="off" />
    </div>
    <div class="row">
      <label>Mini AppSecret</label>
      <input type="password" id="miniAppSecret" autocomplete="off" placeholder="留空则不修改已保存的密钥" />
    </div>
  </section>

  <div class="actions">
    <button type="button" class="primary" id="btnSave">保存</button>
    <button type="button" class="ghost" id="btnReload">重新加载</button>
    <button type="button" class="ghost" id="btnProbe">探测 IP / 白名单</button>
  </div>
  <p class="warn">请勿将含密钥的配置提交到 Git。建议在项目 <code>.gitignore</code> 中加入 <code>.mk-wechat-publish/</code>。发布走本机公网 IP，须加入对应公众号的 IP 白名单。</p>
  <p class="sub" style="margin-top:16px">欢迎关注公众号 <strong style="color:var(--accent)">XLanAI</strong>（微信搜「XLanAI」）· 作者微信 MarkTo2088</p>
  <pre id="probeOut" style="display:none;white-space:pre-wrap;background:#12151a;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:0.8rem;line-height:1.45;color:var(--muted);margin-top:12px;"></pre>
  <p id="msg"></p>
  <p class="path" id="cfgPath"></p>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const msg = $('msg');

  function normalizeHex(h) {
    h = String(h || '').trim();
    if (!h) return '#222222';
    if (h[0] !== '#') h = '#' + h;
    if (/^#[0-9a-fA-F]{3}$/.test(h)) {
      h = '#' + h[1] + h[1] + h[2] + h[2] + h[3] + h[3];
    }
    return /^#[0-9a-fA-F]{6}$/.test(h) ? h.toLowerCase() : '#222222';
  }

  function linkColor(colorEl, hexEl) {
    colorEl.addEventListener('input', () => { hexEl.value = colorEl.value; });
    hexEl.addEventListener('change', () => {
      hexEl.value = normalizeHex(hexEl.value);
      colorEl.value = hexEl.value;
    });
  }
  linkColor($('primaryColor'), $('primaryHex'));
  linkColor($('secondaryColor'), $('secondaryHex'));

  function setMsg(text, ok) {
    msg.textContent = text || '';
    msg.className = ok === true ? 'ok' : ok === false ? 'err' : '';
  }

  async function load() {
    setMsg('加载中…');
    const res = await fetch('/api/config');
    const data = await res.json();
    const p = normalizeHex(data.brand?.primary || '#00ff88');
    const s = normalizeHex(data.brand?.secondary || '#00d4ff');
    $('primaryHex').value = p;
    $('primaryColor').value = p;
    $('secondaryHex').value = s;
    $('secondaryColor').value = s;
    $('galleryWidth').value = data.gallery?.image_width || 62;
    $('wechatName').value = data.wechat?.name || '';
    $('wechatAppId').value = data.wechat?.appId || '';
    $('wechatAppSecret').value = '';
    $('wechatAppSecret').placeholder = data.wechat?.hasSecret
      ? '已保存（留空不修改）'
      : '未设置';
    $('miniAppId').value = data.mini?.appId || '';
    $('miniAppSecret').value = '';
    $('miniAppSecret').placeholder = data.mini?.hasSecret
      ? '已保存（留空不修改）'
      : '未设置';
    $('cfgPath').textContent =
      '写入: ' +
      (data.path || '') +
      (data.scope === 'workspace' ? '（工作空间）' : '（skill 级）') +
      (data.workspaceRoot ? ' · 空间 ' + data.workspaceRoot : '');
    setMsg('已加载', true);
  }

  $('btnReload').addEventListener('click', () => load().catch((e) => setMsg(String(e), false)));
  $('btnProbe').addEventListener('click', async () => {
    const out = $('probeOut');
    out.style.display = 'block';
    out.textContent = '探测中…';
    setMsg('正在探测公网 IP 与微信连通性…');
    try {
      const res = await fetch('/api/probe');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '探测失败');
      out.textContent = data.text || JSON.stringify(data, null, 2);
      setMsg(data.ok ? '探测通过，可以发布' : '探测未通过，请按下方步骤设置 IP 白名单', data.ok);
    } catch (e) {
      out.textContent = String(e.message || e);
      setMsg(String(e.message || e), false);
    }
  });
  $('btnSave').addEventListener('click', async () => {
    const body = {
      brand: {
        primary: normalizeHex($('primaryHex').value),
        secondary: normalizeHex($('secondaryHex').value),
      },
      gallery: { image_width: Number($('galleryWidth').value) || 62 },
      wechat: {
        name: $('wechatName').value.trim(),
        appId: $('wechatAppId').value.trim(),
        appSecret: $('wechatAppSecret').value,
      },
      mini: {
        appId: $('miniAppId').value.trim(),
        appSecret: $('miniAppSecret').value,
      },
      keepSecretsIfEmpty: true,
    };
    try {
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '保存失败');
      $('cfgPath').textContent =
        '写入: ' +
        (data.path || '') +
        (data.scope === 'workspace' ? '（工作空间）' : '（skill 级）');
      $('wechatAppSecret').value = '';
      $('miniAppSecret').value = '';
      setMsg('已保存到工作空间配置', true);
      await load();
    } catch (e) {
      setMsg(String(e.message || e), false);
    }
  });

  load().catch((e) => setMsg(String(e), false));
})();
</script>
</body>
</html>
